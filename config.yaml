# 预测市场数据模拟器。本配置默认以 DB-only 常驻模式持续生成测试市场与交易。
runtime:
  # 执行安全开关；preview 模式不受此项限制。
  enabled: true

  # preview：只生成计划；execute：按 regenerate_plan_on_execute 决定生成新计划或复用旧计划。
  mode: "execute"

  # true：常驻运行，反复生成新一轮市场与延迟交易；false：执行一轮后退出。
  continuous: true

  # execute 时是否调用合约。false 仅写 MySQL；true 上链后同步 MySQL。
  on_chain: true

  # preview 写入、execute 读取的计划文件；含模拟账户私钥，仅限本地使用。
  plan_file: "out/simulator-plan.json"

  # true：execute 每次启动都重新随机生成并覆盖 plan_file；false：重复执行已有计划。
  regenerate_plan_on_execute: true

  # 真实上链的二次确认；需与 mode=execute、on_chain=true 同时开启。
  approve_on_chain: true

  # 旧版预览开关；保持 false，统一使用 mode。
  dry_run: false

chain:
  # 仅真实上链必填：用于给模拟账户发测试币。不要提交私钥。
  private_key: "91d2b0df57b76eee51a7b3f4bda39ec53813968fbf9f8e04033f3c4e9ba4cb2f"

  # 预测市场合约地址；DB-only 模式也会写入该地址。
  contract_address: "0xad4F9eD0F2b51A26314C9f83DF588cCcE26ae03c"

  # use_broker_chain=false 的真实上链 RPC 地址。
  rpc_url: "http://127.0.0.1:42515"

  # use_broker_chain=true 的 BrokerChain 网关地址。
  broker_chain_url: "https://dash.broker-chain.com:440/"

  # false 使用 rpc_url；true 使用 broker_chain_url。
  use_broker_chain: false

mysql:
  # execute 必填，且必须含数据库名。例如 user:password@tcp(host:3306)/db?parseTime=true。
  dsn: "root:12345678@tcp(127.0.0.1:3306)/predictionmarket_local?charset=utf8mb4&parseTime=True&loc=Local"

  # 连接池最大连接数。
  max_open_connections: 10

  # 连接池最大空闲连接数。
  max_idle_connections: 2

  # 单连接最长复用时间（秒）。
  connection_max_lifetime_seconds: 300

ipfs:
  # 创建链上博弈池前上传 metadata 的地址；默认使用后端自带本地内容服务。
  # 真实 Kubo/IPFS 可改为 http://127.0.0.1:5001/api/v0/add?pin=true。
  upload_url: "http://127.0.0.1:8081/api/v1/ipfs/add"

scenario:
  # create_and_trade：创建新池并交易；trade_existing：交易 existing_game_ids。
  # DB-only 从 MySQL 恢复已有池状态；on_chain=true 时直接读取并交易链上池。
  type: "create_and_trade"

  # create_and_trade 创建的市场数。
  market_count: 3

  # trade_existing 要交易的已有 game_id，例如 [1, 2, 3]。
  existing_game_ids: []

  # 随机账户数；creator_also_trades=false 时至少为 2。
  participants: 8

  # 每个市场的最少交易笔数，不能大于最大值。
  trades_per_market_min: 5

  # 每个市场的最多交易笔数，不能小于最小值。
  trades_per_market_max: 15

market:
  # 可随机创建的市场模板；留空 [] 使用全部支持类型。
  types:
    - "TYPE_PRICE"
    - "TYPE_RETURN_THRESHOLD"
    - "TYPE_PRICE_THRESHOLD"
    - "TYPE_PRICE_RANGE"
    - "TYPE_RELATIVE"
    - "TYPE_STREAK"

  # 初始流动性随机范围（BKC）；字符串避免小数精度问题。
  initial_liquidity_min_bkc: "3"

  initial_liquidity_max_bkc: "12"

  # 观察期按整天生成；可配置 1-4 天，起止自动归一到北京时间有效零点。
  duration_min_seconds: 86400

  duration_max_seconds: 345600

trade:
  # 单笔买入金额随机范围（BKC）；字符串避免小数精度问题。
  buy_min_bkc: "0.2"

  buy_max_bkc: "2"

  # 创建者是否参与自己创建的市场。
  creator_also_trades: false

timing:
  # 每笔操作之间的间隔（秒，可为小数），用于降低链和网关压力。
  pause_seconds: 0.2

  # 市场创建后，每笔购买相对上一笔购买的随机等待范围（秒）。
  trade_interval_min_seconds: 10
  trade_interval_max_seconds: 60

  # 一轮市场和交易完成后，开始下一轮前的随机等待范围（秒）。
  cycle_interval_min_seconds: 60
  cycle_interval_max_seconds: 180

  # 单轮模拟的最长执行时间（秒）；常驻模式不会受总运行时长限制。
  timeout_seconds: 3600
